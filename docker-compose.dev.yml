# Hermes development stack. Run one scheduler per deployment.
# Copy .env.example to .env and set HERMES_SECRET_KEY before starting.

x-backend: &backend
  build:
    context: ./packages/hermes-api
    dockerfile: Dockerfile
    args:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    HERMES_SECRET_KEY: ${HERMES_SECRET_KEY:?Set HERMES_SECRET_KEY in .env}
    HERMES_REDIS_URL: ${HERMES_REDIS_URL:-redis://redis:6379/0}
    HERMES_TRUSTED_PROXY_HOSTS: ${HERMES_TRUSTED_PROXY_HOSTS:-app}
    HERMES_DEBUG: "true"
    HERMES_ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:8000"]'
  volumes:
    - ./data/downloads:/app/downloads
    - ./data/temp:/app/temp
    - ./data/data:/app/data
    - ./packages/hermes-api/app:/app/app
  networks:
    - hermes-network

services:
  app:
    build:
      context: .
      dockerfile: packages/hermes-app/Dockerfile.dev
    container_name: hermes-app-dev
    restart: unless-stopped
    ports:
      - "${HERMES_DEV_PORT:-5173}:5173"
    volumes:
      # Mount source code for hot reload
      - ./packages/hermes-app/src:/app/packages/hermes-app/src
      - ./packages/hermes-app/public:/app/packages/hermes-app/public
      - ./packages/hermes-app/index.html:/app/packages/hermes-app/index.html
      # Prevent overwriting node_modules from host
      - /app/node_modules
      - /app/packages/hermes-app/node_modules
    networks:
      - hermes-network
    environment:
      # Keep browser traffic on the Vite origin; Vite proxies /api to the API container.
      - VITE_API_BASE_URL=/api/v1
      - HERMES_DEV_API_TARGET=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  api:
    <<: *backend
    container_name: hermes-api-dev
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug

  celery_worker:
    <<: *backend
    container_name: hermes-worker-dev
    hostname: hermes-worker-dev
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=debug --concurrency=1 --hostname=hermes-worker@%h --queues=hermes.downloads,hermes.cleanup,hermes.default
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--destination=hermes-worker@hermes-worker-dev"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *backend
    container_name: hermes-beat-dev
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.worker beat --loglevel=info --schedule=/app/data/celerybeat-schedule --pidfile=/tmp/hermes-beat.pid
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/hermes-beat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: hermes-redis-dev
    restart: unless-stopped
    ports:
      # Expose for debugging with redis-cli
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  hermes-network:
    driver: bridge

volumes:
  redis_data_dev:    # Separate Redis data for development
