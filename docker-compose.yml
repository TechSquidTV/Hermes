# Hermes source-build production stack. Run one scheduler per deployment.
# Copy .env.example to .env and set HERMES_SECRET_KEY before starting.

x-backend: &backend
  build:
    context: ./packages/hermes-api
    dockerfile: Dockerfile
    args:
      USER_UID: ${USER_UID:-1000}
      USER_GID: ${USER_GID:-1000}
  restart: unless-stopped
  env_file:
    - .env
  environment:
    HERMES_SECRET_KEY: ${HERMES_SECRET_KEY:?Set HERMES_SECRET_KEY in .env}
    HERMES_REDIS_URL: ${HERMES_REDIS_URL:-redis://redis:6379/0}
    HERMES_TRUSTED_PROXY_HOSTS: ${HERMES_TRUSTED_PROXY_HOSTS:-app}
  volumes:
    - ./data/downloads:/app/downloads
    - ./data/temp:/app/temp
    - ./data/data:/app/data
  networks:
    - hermes-network

services:
  app:
    build:
      context: .
      dockerfile: packages/hermes-app/Dockerfile
    container_name: hermes-app
    restart: unless-stopped
    ports:
      - "${HERMES_PORT:-3000}:80"
    environment:
      # Optional: Configure API base URL at runtime
      # Examples:
      #   - Same domain (default): /api/v1
      #   - Separate subdomain: https://api.hermes.example.com/api/v1
      #   - Different domain: https://hermes-api.mydomain.com/api/v1
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}
    networks:
      - hermes-network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    <<: *backend
    container_name: hermes-api
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --loop asyncio --access-log --log-level info

  celery_worker:
    <<: *backend
    container_name: hermes-worker
    hostname: hermes-worker
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info --concurrency=1 --hostname=hermes-worker@%h --queues=hermes.downloads,hermes.cleanup,hermes.default
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker", "inspect", "ping", "--destination=hermes-worker@hermes-worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    <<: *backend
    container_name: hermes-beat
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: celery -A app.worker beat --loglevel=info --schedule=/app/data/celerybeat-schedule --pidfile=/tmp/hermes-beat.pid
    healthcheck:
      test: ["CMD", "python", "-c", "import os; from pathlib import Path; os.kill(int(Path('/tmp/hermes-beat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: hermes-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - hermes-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

networks:
  hermes-network:
    driver: bridge

volumes:
  redis_data:        # Redis data persistence
