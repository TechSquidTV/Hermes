version: 2

# Dependabot owns dependency updates for this repository.
# Keep one entry per ecosystem/lockfile to avoid competing update PRs.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "America/New_York"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions", "automated"]
    commit-message:
      prefix: "ci"
      include: "scope"

  # The root pnpm lockfile covers both root tools and the frontend workspace.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "America/New_York"
    groups:
      javascript:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies", "pnpm", "automated"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Native uv support updates pyproject.toml and uv.lock together.
  - package-ecosystem: "uv"
    directory: "/packages/hermes-api"
    schedule:
      # Include weekends: Dependabot's "daily" interval only runs on weekdays.
      interval: "cron"
      cronjob: "15 5 * * *"
      timezone: "America/New_York"
    allow:
      - dependency-type: "all"
    groups:
      # Do not filter update types: yt-dlp uses calendar versions.
      yt-dlp:
        patterns: ["yt-dlp", "yt-dlp-ejs"]
      python:
        patterns: ["*"]
        exclude-patterns: ["yt-dlp", "yt-dlp-ejs"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 3
      exclude: ["yt-dlp", "yt-dlp-ejs"]
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Includes Dockerfile.dev and all runtime stages, including the pinned uv image.
  - package-ecosystem: "docker"
    directories:
      - "/packages/hermes-api"
      - "/packages/hermes-app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "build"
      include: "scope"
