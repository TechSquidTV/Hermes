name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Determine which packages have changes
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
      
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            frontend:
              - 'packages/hermes-app/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/dependabot.yml'
              - '.github/workflows/**'
            backend:
              - 'packages/hermes-api/**'
              - 'package.json'
              - '.github/dependabot.yml'
              - '.github/workflows/**'

  # Frontend validation
  frontend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter hermes-app type-check

      - name: Lint
        run: pnpm --filter hermes-app lint

      - name: Build
        run: pnpm --filter hermes-app build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Test with coverage
        run: pnpm --filter hermes-app test:coverage

      - name: Build frontend Docker images
        run: |
          docker build --pull -f packages/hermes-app/Dockerfile .
          docker build --pull -f packages/hermes-app/Dockerfile.dev .

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/hermes-app/coverage/lcov.info
          flags: frontend
          name: frontend-coverage
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/hermes-app/junit.xml

  # Backend validation
  backend-checks:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: packages/hermes-api
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --locked --all-groups

      - name: Run black (format check)
        working-directory: packages/hermes-api
        run: uv run --locked black --check app/ tests/

      - name: Run isort (import sorting check)
        working-directory: packages/hermes-api
        run: uv run --locked isort --check-only app/ tests/

      - name: Run ruff (linting)
        working-directory: packages/hermes-api
        run: uv run --locked ruff check app/ tests/

      - name: Run mypy (type checking)
        working-directory: packages/hermes-api
        run: uv run --locked python -m mypy --explicit-package-bases app/ tests/

      - name: Run tests with coverage
        working-directory: packages/hermes-api
        run: uv run --locked pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit.xml

      - name: Build API Docker image
        run: docker build --pull -f packages/hermes-api/Dockerfile packages/hermes-api

      - name: List coverage files (debug)
        working-directory: packages/hermes-api
        run: ls -la *.xml || echo "No XML files found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/hermes-api/coverage.xml
          flags: backend
          name: backend-coverage
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/hermes-api/junit.xml

  # Summary job that gates merging
  pr-checks-complete:
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-checks, backend-checks]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.detect-changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed"
            exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.frontend }}" == "true" && "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "Required frontend checks did not succeed"
            exit 1
          fi

          if [[ "${{ needs.detect-changes.outputs.backend }}" == "true" && "${{ needs.backend-checks.result }}" != "success" ]]; then
            echo "Required backend checks did not succeed"
            exit 1
          fi

          echo "All required checks passed!"
